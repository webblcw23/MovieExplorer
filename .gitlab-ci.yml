workflow:
  rules:
  - when: always  # Always create a pipeline on push

stages:
  - core 
  - terraform
  - deployapp
  - destroy

# ────────────────────────────────
# 🧱 Core Infrastructure Setup
# ────────────────────────────────

variables:
  # Core infra
  LOCATION: "uksouth"
  RESOURCE_GROUP: "movie-explorer-rg"
  STORAGE_ACCOUNT: "lewisfuncstorage"
  CONTAINER_NAME: "tfstate"
  ACR_NAME: "lewisacr"

  # Terraform
  WORKING_DIR: "Terraform/"
  BACKEND_KEY: "movieexplorer-prod.tfstate"

  # App deploy
  DOCKER_REGISTRY: "lewisacr.azurecr.io"
  BACKEND_IMAGE_NAME: "movieexplorer-backend"
  FRONTEND_IMAGE_NAME: "movieexplorer-frontend"
  WEBAPP_NAME: "MovieExplorerAppBackend"
  SQL_SERVER_NAME: "sql-server-lewis-test"


create_rg:
  stage: core
  image: mcr.microsoft.com/azure-cli
  script:
    - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET_GITLAB" --tenant "$AZURE_TENANT_ID"
    - az group create --name "$RESOURCE_GROUP" --location "$LOCATION"
  rules:
   - when: manual

create_storage:
  stage: core
  image: mcr.microsoft.com/azure-cli
  script:
    - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET_GITLAB" --tenant "$AZURE_TENANT_ID"
    - az storage account create --name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" --location "$LOCATION" --sku Standard_LRS
  needs:
    - create_rg

create_container:
  stage: core
  image: mcr.microsoft.com/azure-cli
  script:
    - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET_GITLAB" --tenant "$AZURE_TENANT_ID"
    - az storage container create --name "$CONTAINER_NAME" --account-name "$STORAGE_ACCOUNT"
  needs:
    - create_storage

create_acr:
  stage: core
  image: mcr.microsoft.com/azure-cli
  script:
    - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET_GITLAB" --tenant "$AZURE_TENANT_ID"
    - az acr create --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --sku Basic --location "$LOCATION"
  needs:
    - create_container

# ────────────────────────────────
# 🌍 Terraform Infrastructure
# ────────────────────────────────

terraforminit:
  stage: terraform
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y curl jq python3-pip unzip gnupg software-properties-common
    - pip3 install azure-cli
    - curl -fsSL https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -o terraform.zip
    - unzip terraform.zip && mv terraform /usr/local/bin/terraform && terraform -version
    - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET_GITLAB" --tenant "$AZURE_TENANT_ID"
  script:
    - terraform -chdir=$WORKING_DIR init -backend-config="resource_group_name=$RESOURCE_GROUP" -backend-config="storage_account_name=$STORAGE_ACCOUNT" -backend-config="container_name=$CONTAINER_NAME" -backend-config="key=$BACKEND_KEY" -reconfigure -upgrade
    - terraform -chdir=$WORKING_DIR validate
    - terraform -chdir=$WORKING_DIR fmt -recursive
  rules:
   - when: manual


terraformplan:
  stage: terraform  
  image: hashicorp/terraform:latest
  script:
    - terraform -chdir=$WORKING_DIR plan -var="subscription_id=$SUBSCRIPTION_ID" -var="sql_admin_username=$SQL_ADMIN_USERNAME" -var="sql_admin_password=$SQL_ADMIN_PASSWORD"
  needs:
    - terraforminit
  rules:
   - when: manual



terraformapply:
  stage: terraform
  image: hashicorp/terraform:latest
  script:
    - terraform -chdir=$WORKING_DIR apply -auto-approve -var="subscription_id=$SUBSCRIPTION_ID" -var="sql_admin_username=$SQL_ADMIN_USERNAME" -var="sql_admin_password=$SQL_ADMIN_PASSWORD"
  needs:
    - terraformplan
  rules:
   - when: manual


# ────────────────────────────────
# 🚀 App Deployment
# ────────────────────────────────

deploy_app:
  stage: deployapp
  image: mcr.microsoft.com/azure-cli
  before_script:
    - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET_GITLAB" --tenant "$AZURE_TENANT_ID"
    - az acr login --name "$DOCKER_REGISTRY"
    - apk add --no-cache docker
  script:
    - docker build --platform linux/amd64 -t "$DOCKER_REGISTRY/$BACKEND_IMAGE_NAME:latest" movieexplorer-backend-api
    - docker push "$DOCKER_REGISTRY/$BACKEND_IMAGE_NAME:latest"
    - docker build --platform linux/amd64 -t "$DOCKER_REGISTRY/$FRONTEND_IMAGE_NAME:latest" movieexplorer-frontend
    - docker push "$DOCKER_REGISTRY/$FRONTEND_IMAGE_NAME:latest"
    - IP=$(az webapp show --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP" --query outboundIpAddresses -o tsv)
    - az sql server firewall-rule create --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER_NAME" --name "AllowAppService" --start-ip-address "$IP" --end-ip-address "$IP"
  rules:
   - when: manual


# ────────────────────────────────
# 💣 Terraform Destroy
# ────────────────────────────────

terraform_destroy:
  stage: destroy
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y curl jq python3-pip unzip gnupg software-properties-common
    - pip3 install azure-cli
    - curl -fsSL https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -o terraform.zip
    - unzip terraform.zip && mv terraform /usr/local/bin/terraform && terraform -version
    - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET_GITLAB" --tenant "$AZURE_TENANT_ID"
  script:
    - terraform -chdir=$WORKING_DIR init \
        -backend-config="resource_group_name=$RESOURCE_GROUP" \
        -backend-config="storage_account_name=$STORAGE_ACCOUNT" \
        -backend-config="container_name=$CONTAINER_NAME" \
        -backend-config="key=$BACKEND_KEY" \
        -reconfigure -upgrade \
        -var="sql_admin_username=$SQL_ADMIN_USERNAME" \
        -var="sql_admin_password=$SQL_ADMIN_PASSWORD" \
        -var="subscription_id=$SUBSCRIPTION_ID"
    - terraform -chdir=$WORKING_DIR show
    - terraform -chdir=$WORKING_DIR destroy -auto-approve \
        -var="sql_admin_username=$SQL_ADMIN_USERNAME" \
        -var="sql_admin_password=$SQL_ADMIN_PASSWORD" \
        -var="subscription_id=$SUBSCRIPTION_ID"
  rules:
   - when: manual
